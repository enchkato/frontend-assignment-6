<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6 | Part 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Assignment 6</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Part 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="part2.html">Part 2</a></li>
                    <li class="nav-item"><a class="nav-link active" href="part3.html">Part 3</a></li>
                    <li class="nav-item"><a class="nav-link" href="part4.html">Part 4</a></li>
                    <li class="nav-item"><a class="nav-link" href="part5.html">Part 5</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="mb-4">Part 3: DOM &amp; Form</h2>

        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Task 5: List Items</h5>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <ul id="dynamic-list" class="list-group mb-3 flex-grow-1">
                            <li class="list-group-item">Item 1</li>
                            <li class="list-group-item">Item 2</li>
                        </ul>
                        <div class="d-flex flex-column gap-2">
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-success w-50" id="btn-append">Append</button>
                                <button type="button" class="btn btn-primary w-50" id="btn-prepend">Prepend</button>
                            </div>
                            <button type="button" class="btn btn-danger w-100" id="btn-remove">Remove Last</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Task 6: Attributes</h5>
                    </div>
                    <div class="card-body d-flex flex-column text-center">
                        <div class="mb-3 flex-grow-1 d-flex flex-column align-items-center justify-content-center">
                            <img id="attr-img" src="https://picsum.photos/id/1025/240/130" alt="Dog" class="img-fluid rounded border mb-2">
                            <div>
                                <a id="attr-link" href="https://astanait.edu.kz" target="_blank" class="text-decoration-none fw-bold">Open AITU</a>
                            </div>
                        </div>
                        <div class="d-flex flex-column gap-2">
                            <button type="button" class="btn btn-outline-primary" id="btn-change-img">Switch Image</button>
                            <button type="button" class="btn btn-outline-success" id="btn-change-link">Switch Link</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Task 7: Live Input</h5>
                    </div>
                    <div class="card-body">
                        <form id="live-form">
                            <div class="mb-3">
                                <label for="form-name" class="form-label">Name:</label>
                                <input type="text" id="form-name" class="form-control" placeholder="Your name">
                            </div>
                            <div class="mb-3">
                                <label for="form-email" class="form-label">Email:</label>
                                <input type="email" id="form-email" class="form-control" placeholder="Your email">
                            </div>
                        </form>
                        <div class="p-3 bg-light border rounded mt-3">
                            <p class="mb-1"><strong>Name:</strong> <span id="live-name-out" class="text-primary">-</span></p>
                            <p class="mb-0"><strong>Email:</strong> <span id="live-email-out" class="text-success">-</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-3 text-center text-muted">
        <div class="container">
            <small>&copy; Kudaibergen Temirlan SE-2528</small>
        </div>
    </footer>

    <script src="js/part3.js"></script>
</body>
</html>
