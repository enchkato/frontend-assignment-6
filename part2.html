</head>

        <div class="container">
            <a class="navbar-brand" href="index.html">Assignment 6</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Part 1</a></li>
                    <li class="nav-item"><a class="nav-link active" href="part2.html">Part 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="part3.html">Part 3</a></li>

                    <li class="nav-item"><a class="nav-link" href="part5.html">Part 5</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="mb-4">Part 2: jQuery Effects</h2>

        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Task 2: Visibility</h5>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <p id="vis-text" class="p-3 bg-light border rounded flex-grow-1">
                            This is a sample text block for testing visibility methods.
                        </p>
                        <div class="d-flex gap-2 mt-3">
                            <button type="button" class="btn btn-danger w-100" id="btn-hide">Hide</button>
                            <button type="button" class="btn btn-success w-100" id="btn-show">Show</button>
                            <button type="button" class="btn btn-primary w-100" id="btn-toggle">Toggle</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Task 3: Fade</h5>
                    </div>
                    <div class="card-body d-flex flex-column text-center">
                        <div class="flex-grow-1 d-flex align-items-center justify-content-center">
                            <img id="fade-img" src="https://picsum.photos/id/1018/260/140" alt="Mountain" class="img-fluid rounded border">
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button type="button" class="btn btn-outline-danger w-100" id="btn-fade-out">Out</button>
                            <button type="button" class="btn btn-outline-success w-100" id="btn-fade-in">In</button>
                            <button type="button" class="btn btn-outline-primary w-100" id="btn-fade-toggle">Toggle</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Task 4: Slide</h5>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <div id="slide-box" class="slide-panel mb-3 flex-grow-1">
                            <h6>Drop Panel</h6>
                            <p class="mb-0 small">Slide animation test area.</p>
                        </div>
                        <div class="d-flex gap-2 mt-auto">
                            <button type="button" class="btn btn-outline-secondary w-100" id="btn-slide-up">Up</button>
                            <button type="button" class="btn btn-outline-secondary w-100" id="btn-slide-down">Down</button>
                            <button type="button" class="btn btn-primary w-100" id="btn-slide-toggle">Toggle</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
